name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test & package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test

      # Ship production dependencies only (drops azure-functions-core-tools etc.).
      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package
        run: zip -r ../backend.zip . -x '.git*' '.vscode/*' 'local.settings.json' 'test/*' '*.ts' '*.js.map'

      - uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend.zip
          retention-days: 7

  deploy:
    name: Deploy → Function App
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC to Azure
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-package

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The deploy endpoint (Kudu/scm) denies all IPs by default (see terraform/main.tf).
      # GitHub-hosted runners have no fixed IP, so allow this runner's IP for the deploy only.
      - name: Allow runner IP on deploy endpoint
        env:
          APP: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          RULE: gh-run-${{ github.run_id }}
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          echo "Runner IP: $ip"
          az functionapp config access-restriction add -g "$RG" -n "$APP" \
            --scm-site true --rule-name "$RULE" --action Allow \
            --ip-address "$ip/32" --priority 100 -o none

          # Wait until the rule is live: Kudu answers 401 (auth needed) instead of 403 (IP denied).
          scm=$(az resource show --ids "$(az functionapp show -g "$RG" -n "$APP" --query id -o tsv)" \
            --query "properties.hostNameSslStates[?hostType=='Repository'].name | [0]" -o tsv)
          echo "Deploy endpoint: $scm"
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$scm/api/settings" || true)
            # 000 = no connection, 403 = IP still blocked. Anything else means the rule is live.
            if [ "$code" != "403" ] && [ "$code" != "000" ]; then
              echo "Deploy endpoint reachable ($code)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Deploy endpoint still returns 403 after 150s"
          exit 1

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: backend.zip
          sku: flexconsumption

      - name: Remove runner IP from deploy endpoint
        if: always()
        env:
          APP: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          RULE: gh-run-${{ github.run_id }}
        run: |
          az functionapp config access-restriction remove -g "$RG" -n "$APP" \
            --scm-site true --rule-name "$RULE" -o none || true
